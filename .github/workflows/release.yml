# Builds Foxinal for macOS (Apple Silicon + Intel) and Linux (x64),
# then uploads installers to a draft GitHub Release.
#
# 1) prepare — resolve version once + create the draft release
# 2) publish-tauri — matrix builds upload into that same release (no race)
#
# Trigger: push tag `v*` or Actions → release → Run workflow
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.2.0). Leave empty to auto-bump patch."
        required: false
        type: string

env:
  # Prefer RELEASE_TOKEN when the org locks GITHUB_TOKEN to read-only.
  GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

jobs:
  prepare:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve release version
        id: ver
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
          else
            node scripts/set-version.mjs --bump patch
            VERSION="$(node -p "require('./package.json').version")"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Sync version into package files
        run: node scripts/set-version.mjs "${{ steps.ver.outputs.version }}"

      - name: Create or reuse draft release
        id: release
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          TAG="v${VERSION}"
          NOTES="$(cat <<'EOF'
          Download the installer for your OS below.

          - **macOS Apple Silicon** (M series): `*-aarch64.dmg`
          - **macOS Intel**: `*-x64.dmg`
          - **Linux**: `.AppImage` (portable) or `.deb` / `.rpm`

          macOS builds are **not Apple-signed**. If Gatekeeper says the app is damaged, after installing to Applications run:

          ```
          xattr -cr /Applications/foxinal.app
          ```

          Then open the app normally. See the README **Download (macOS)** section for details.
          EOF
          )"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — reusing it"
          else
            gh release create "$TAG" \
              --draft \
              --title "Foxinal ${TAG}" \
              --notes "$NOTES"
          fi

          RELEASE_ID="$(gh api "repos/${{ github.repository }}/releases/tags/${TAG}" --jq .id)"
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "Using release id $RELEASE_ID ($TAG)"

  publish-tauri:
    needs: prepare
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v6

      - name: Sync version into package files
        run: node scripts/set-version.mjs "${{ needs.prepare.outputs.version }}"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.platform }}-${{ matrix.args }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and upload to GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ env.GH_TOKEN }}
          # Avoid AppImage strip failures on newer glibc toolchains
          NO_STRIP: true
        with:
          tagName: v__VERSION__
          releaseId: ${{ needs.prepare.outputs.release_id }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
