# Builds Foxinal for macOS (Apple Silicon + Intel) and Linux (x64),
# then uploads installers to a draft GitHub Release.
#
# Trigger: push a version tag (v0.1.0) or run manually from Actions.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and upload to GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Avoid AppImage strip failures on newer glibc toolchains
          NO_STRIP: true
        with:
          tagName: v__VERSION__
          releaseName: Foxinal v__VERSION__
          releaseBody: |
            Download the installer for your OS below.

            - **macOS Apple Silicon**: `*-aarch64.dmg`
            - **macOS Intel**: `*-x64.dmg`
            - **Linux**: `.AppImage` (portable) or `.deb` / `.rpm`

            Builds are unsigned. On macOS, right-click the app → Open the first time.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
