# Builds Foxinal for macOS (Apple Silicon + Intel) and Linux (x64),
# then uploads installers to a draft GitHub Release.
#
# Version source of truth for releases:
#   - tag push `v0.2.0` → syncs that version into all package files, then builds
#   - workflow_dispatch → optional version input, or auto bump patch
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.2.0). Leave empty to auto-bump patch."
        required: false
        type: string

jobs:
  publish-tauri:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: Resolve release version
        id: ver
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
          else
            VERSION=""
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version input: ${VERSION:-<auto patch bump>}"

      - name: Sync version into package files
        run: |
          if [[ -n "${{ steps.ver.outputs.version }}" ]]; then
            node scripts/set-version.mjs "${{ steps.ver.outputs.version }}"
          else
            node scripts/set-version.mjs --bump patch
          fi

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Prefer RELEASE_TOKEN (PAT) when the org locks GITHUB_TOKEN to read-only.
      # Create a classic PAT with `repo` (or fine-grained: Contents + Metadata read/write),
      # then add it as repo secret RELEASE_TOKEN.
      - name: Build and upload to GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          # Avoid AppImage strip failures on newer glibc toolchains
          NO_STRIP: true
        with:
          tagName: v__VERSION__
          releaseName: Foxinal v__VERSION__
          releaseBody: |
            Download the installer for your OS below.

            - **macOS Apple Silicon** (M series): `*-aarch64.dmg`
            - **macOS Intel**: `*-x64.dmg`
            - **Linux**: `.AppImage` (portable) or `.deb` / `.rpm`

            macOS builds are **not Apple-signed**. If Gatekeeper says the app is damaged, after installing to Applications run:

            ```
            xattr -cr /Applications/foxinal.app
            ```

            Then open the app normally. See the README **Download (macOS)** section for details.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
